<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kongming Quantum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+JP:wght@600;900&family=Noto+Serif+KR:wght@600;900&family=Noto+Serif+SC:wght@600&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: a night sky of ink-wash mountains and drifting particles; content floats above in a 1180px column. One dark world, committed. */
:root{
  --night:#060912;
  --ink:#0d1324;
  --ink-2:#141c33;
  --line:rgba(150,172,226,.16);
  --paper:#ece6d6;
  --mist:#9aa3bf;
  --jade:#3ff0d8;
  --gold:#f0c35a;
  --seal:#c8382f;
  --f-cjk:"Noto Serif TC","Noto Serif JP","Noto Serif KR",serif;
  --f-sans-cjk:"Noto Sans TC","Noto Sans JP","Noto Sans KR";
  --f-disp:"Cormorant Garamond",var(--f-cjk);
  --f-body:"Be Vietnam Pro",var(--f-sans-cjk),system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[lang="ja"]{--f-cjk:"Noto Serif JP","Noto Serif TC",serif;--f-sans-cjk:"Noto Sans JP","Noto Sans TC"}
:root[lang="ko"]{--f-cjk:"Noto Serif KR","Noto Serif TC",serif;--f-sans-cjk:"Noto Sans KR","Noto Sans TC"}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) body{line-height:2.2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
a{color:var(--jade)}
ruby{ruby-position:over}
rt{font-family:var(--f-cjk);font-size:.52em;color:var(--gold);letter-spacing:0;opacity:.92;font-weight:600}
:focus-visible{outline:2px solid var(--jade);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Ruby (furigana / hangul / simplified) */
:root[lang="zh-Hant"] rt{font-family:"Noto Serif SC","Noto Sans SC",serif}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) h2{line-height:1.9}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) .page-head h1{line-height:1.75}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) :is(.cn,.pcn,.quote-cn,.quote-tr){line-height:1.9}
:root:is([lang="ja"],[lang="ko"],[lang="zh-Hant"]) :is(.glyph,.vg){line-height:1.5}
:is(.cn,.pcn,.path .num) rt{font-size:.36em}
.quote-cn rt{font-size:.3em;letter-spacing:0}
:is(.glyph,.vg) rt{font-size:.2em;-webkit-text-stroke:0;text-shadow:none}
.vtitle i{font-style:normal;font-family:var(--f-cjk);font-weight:600;font-size:.19em;color:var(--gold);writing-mode:vertical-rl;letter-spacing:.05em;filter:none}
.btn rt{color:inherit;opacity:.75}
/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,9,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--paper);margin-right:auto}
.seal{display:grid;grid-template-columns:1fr 1fr;width:40px;height:40px;background:var(--seal);color:#fbeee6;border-radius:3px;font-family:var(--f-cjk);font-weight:900;font-size:16px;line-height:20px;text-align:center;box-shadow:0 0 0 2px rgba(200,56,47,.25),0 0 18px rgba(200,56,47,.35);flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:21px;letter-spacing:.02em}
.brand-txt span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.32em;color:var(--mist)}
nav.main{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--mist);font-size:14px;padding:8px 12px;border-radius:3px;line-height:1.5}
nav.main a:hover{color:var(--paper)}
nav.main a[aria-current="page"]{color:var(--jade);background:rgba(63,240,216,.08);box-shadow:inset 0 -2px 0 var(--jade)}
.langsel{position:relative;display:flex;align-items:center;gap:8px}
.langsel select{appearance:none;-webkit-appearance:none;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 28px 8px 12px;font:500 13px var(--f-body);cursor:pointer;field-sizing:content}
.langsel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}
@media (max-width:760px){
  .top .wrap{gap:10px 12px}
  nav.main{order:3;width:100%;margin-inline:-6px}
  .brand{gap:10px}
  .brand-txt b{font-size:18px}
  .brand-txt span{letter-spacing:.2em}
  .langsel select{padding:7px 26px 7px 10px;font-size:12.5px}
}

/* Type */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
:root:not([lang="en"]) .eyebrow{letter-spacing:.08em;font-family:var(--f-body);font-size:13.5px;font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(30px,4vw,48px);line-height:1.12;letter-spacing:.005em}
:root:not([lang="en"]) h2{font-family:var(--f-cjk);font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.35}
:root[lang="vi"] h2{font-family:"Cormorant Garamond",var(--f-cjk);font-size:clamp(30px,4vw,46px);line-height:1.6}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--paper);opacity:.9;max-width:60ch}
p{margin:0}
.muted{color:var(--mist)}

/* Sections */
.view{display:block}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:grid;gap:14px;max-width:760px;margin-bottom:clamp(28px,4vw,48px)}
.sec-head p{color:var(--mist);max-width:62ch}
.page-head{padding-block:clamp(56px,8vw,96px) clamp(16px,3vw,32px)}
.page-head h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(40px,6vw,78px);line-height:1.05;margin-bottom:18px}
:root:not([lang="en"]) .page-head h1{font-family:var(--f-cjk);font-weight:900;font-size:clamp(34px,5vw,64px);line-height:1.3}
:root[lang="vi"] .page-head h1{font-family:"Cormorant Garamond",var(--f-cjk);font-weight:600;line-height:1.5}
.page-head .lead{color:var(--mist)}

/* Buttons */
.btn{display:inline-block;text-align:center;vertical-align:bottom;font:500 15px var(--f-body);padding:12px 20px;border-radius:3px;border:1px solid var(--jade);color:var(--night);background:var(--jade);text-decoration:none;cursor:pointer;transition:box-shadow .25s,transform .25s;line-height:1.4}
.btn:hover{box-shadow:0 0 24px rgba(63,240,216,.45);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);box-shadow:none}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.gold:hover{box-shadow:0 0 24px rgba(240,195,90,.45)}
.textlink{font-family:var(--f-body);font-weight:500;color:var(--jade);text-decoration:none;border-bottom:1px solid rgba(63,240,216,.35);padding-bottom:2px}
.textlink:hover{border-color:var(--jade)}

/* Hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.95fr);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(40px,6vw,88px)}
.vtitle{display:flex;flex-direction:column;gap:.06em;font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(64px,7.5vw,108px);line-height:1;margin:0;filter:drop-shadow(0 0 22px rgba(63,240,216,.28))}
.vc{display:flex;align-items:center;gap:.08em}
.vc b{font-weight:900;color:var(--paper)}
.vc:nth-child(3) b{color:color-mix(in srgb,var(--paper) 45%,var(--jade))}
.vc:nth-child(4) b{color:var(--jade)}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero-copy h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-style:italic;font-size:clamp(44px,5.6vw,80px);line-height:.98;letter-spacing:-.01em}
.hero-copy h1 em{font-style:normal;color:var(--jade);text-shadow:0 0 28px rgba(63,240,216,.45)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.oracle{display:grid;gap:14px;justify-items:center;min-width:0}
.oracle-stage{position:relative;width:100%;max-width:520px;aspect-ratio:1}
.oracle-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.oracle-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--gold);min-height:1.6em;text-align:center}
:root:not([lang="en"]) .readout{font-family:var(--f-body)}
.caption{font-size:13.5px;color:var(--mist);text-align:center;max-width:46ch}
@media (max-width:980px){
  .hero{grid-template-columns:auto minmax(0,1fr)}
  .oracle{grid-column:1/-1}
}
@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr);row-gap:6px}
  .hero-copy{gap:18px}
  .hero-copy h1{order:-1}
  .hero-copy .eyebrow{margin-top:-8px}
  .vtitle{flex-direction:row;font-size:56px;gap:.04em}
  .vc{flex-direction:column-reverse;gap:2px}
  .vtitle i{writing-mode:horizontal-tb;font-size:.24em}
}

/* Realms */
.realms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.realm{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--line)}
.glyph{font-family:"Noto Serif TC",serif;font-weight:900;font-size:88px;line-height:1;color:transparent;-webkit-text-stroke:1.2px var(--jade);text-shadow:0 0 30px rgba(63,240,216,.22)}
.glyph-rd{font-family:var(--f-cjk);font-weight:600;font-size:18px;line-height:1;color:var(--gold);margin-bottom:-6px}
.realm:nth-child(2) .glyph{-webkit-text-stroke-color:var(--gold);text-shadow:0 0 30px rgba(240,195,90,.2)}
.realm h3{font-size:21px;font-weight:600;line-height:1.4}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .realm h3{line-height:2}
.realm p{color:var(--mist)}
.realm .topics{font-family:var(--f-mono);font-size:12.5px;color:var(--paper);opacity:.8;line-height:1.9}
:root:not([lang="en"]) .realm .topics{font-family:var(--f-body);font-size:13.5px}
@media (max-width:820px){.realms{grid-template-columns:minmax(0,1fr)}}

/* Quote band */
.quote{position:relative;border-block:1px solid var(--line);background:linear-gradient(90deg,rgba(13,19,36,.2),rgba(13,19,36,.85) 30%,rgba(13,19,36,.85) 70%,rgba(13,19,36,.2))}
.quote .wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;padding-block:clamp(40px,6vw,72px)}
.quote-cn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,4.2vw,54px);line-height:1.25;color:var(--gold);letter-spacing:.08em;text-shadow:0 0 30px rgba(240,195,90,.25);margin:0}
.quote-body{display:grid;gap:10px;min-width:0}
.quote-tr{font-family:"Cormorant Garamond",var(--f-cjk);font-style:italic;font-size:clamp(20px,2.2vw,26px);line-height:1.45}
:root:not([lang="en"]) .quote-tr{font-style:normal;font-family:var(--f-cjk);font-weight:600;font-size:clamp(18px,2vw,22px)}
.quote-src{font-size:13.5px;color:var(--mist)}
@media (max-width:720px){.quote .wrap{grid-template-columns:minmax(0,1fr)}}

/* Cards */
.card{background:rgba(13,19,36,.78);border:1px solid var(--line);border-radius:4px;padding:24px;display:grid;gap:12px;align-content:start;transition:border-color .3s,box-shadow .3s;min-width:0}
.card:hover{border-color:rgba(63,240,216,.45);box-shadow:0 0 0 1px rgba(63,240,216,.12),0 18px 40px -24px rgba(63,240,216,.35)}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.feat-grid{grid-template-columns:minmax(0,1fr)}}
.cn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;line-height:1.15;letter-spacing:.06em;color:var(--paper)}
.tri-row{display:flex;align-items:center;gap:12px}
.tri-row svg{flex:none}
.tri-meta{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);letter-spacing:.04em}
.sname{font-size:15px;color:var(--jade);font-weight:500}
.card .lesson-p{color:var(--mist)}
.more{margin-top:28px}

/* Path (home) */
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:4px;background:rgba(13,19,36,.6)}
.path li{list-style:none;padding:22px;display:grid;gap:6px;border-right:1px solid var(--line);min-width:0}
.path li:last-child{border-right:0}
.path .num{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--gold);font-size:14px}
.path .pcn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;letter-spacing:.06em}
.path .psub{color:var(--mist);font-size:14.5px}
ol.path{margin:0;padding:0}
@media (max-width:900px){.path{grid-template-columns:minmax(0,1fr)}.path li{grid-template-columns:28px 6.5rem minmax(0,1fr);align-items:baseline;column-gap:16px;border-right:0;border-bottom:1px solid var(--line);padding-block:14px}.path li:last-child{border-bottom:0}}

/* Stratagems */
.strat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-bottom:clamp(56px,8vw,104px)}
@media (max-width:1140px){.strat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.strat-grid{grid-template-columns:minmax(0,1fr)}}
.strat .cn{font-size:32px}
.part{display:grid;gap:4px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
:root:not([lang="en"]) .lbl{font-family:var(--f-body);letter-spacing:.06em;font-size:12.5px}
.part p{font-size:15px}
.part.lesson{padding:12px 14px;background:rgba(63,240,216,.06);border-left:2px solid var(--jade)}
.part.lesson .lbl{color:var(--jade)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);border:1px solid rgba(240,195,90,.3);padding:3px 8px;border-radius:2px;line-height:1.5}
:root:not([lang="en"]) .tag{font-family:var(--f-body);font-size:12.5px}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .tag{line-height:2}

/* Programs */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;position:relative;margin:0;padding:0}
.levels::before{content:"";position:absolute;top:22px;left:22px;right:22px;height:1px;background:linear-gradient(90deg,var(--gold),var(--jade));opacity:.5}
.level{list-style:none;display:grid;gap:12px;align-content:start;position:relative;min-width:0}
.level .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--night);border:1px solid var(--gold);color:var(--gold);font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;box-shadow:0 0 18px rgba(240,195,90,.3)}
.level .pcn{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1.2}
.level h3{font-size:17px;color:var(--jade);font-weight:500;line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .level h3{line-height:2}
.level p{color:var(--mist);font-size:15px}
@media (max-width:1060px){.levels{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:36px}.levels::before{display:none}}
@media (max-width:560px){.levels{grid-template-columns:minmax(0,1fr)}}
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.labs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.labs{grid-template-columns:minmax(0,1fr)}}
.lab .cn{font-size:26px}
.lab h3{font-size:16px;font-weight:500;color:var(--gold);line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .lab h3{line-height:2}
.lab p{color:var(--mist);font-size:15px}

/* Qubit demo */
.demo{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(20px,3vw,36px);border:1px solid rgba(63,240,216,.3);border-radius:4px;background:radial-gradient(circle at 20% 30%,rgba(63,240,216,.08),transparent 60%),rgba(13,19,36,.85)}
.demo-l{display:grid;gap:14px;justify-items:center}
.demo-l svg{width:100%;max-width:240px;height:auto}
.slider{display:grid;gap:6px;width:100%;max-width:280px}
.slider label{font-size:14px;color:var(--mist);display:flex;justify-content:space-between}
.slider output{font-family:var(--f-mono);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--jade)}
.demo-r{display:grid;gap:18px;min-width:0}
.demo-r h3{font-family:var(--f-disp);font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.25}
:root:not([lang="en"]) .demo-r h3{font-family:var(--f-cjk);font-size:clamp(20px,2.2vw,26px);line-height:1.5}
:root:is([lang="vi"],[lang="ja"],[lang="ko"],[lang="zh-Hant"]) .demo-r h3{line-height:2}
.demo-r > p{color:var(--mist)}
.bars{display:grid;gap:14px}
.bar{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:12px;align-items:center}
.bar .k{font-family:var(--f-mono);color:var(--paper);font-size:15px}
.track{position:relative;height:22px;background:rgba(150,172,226,.1);border-radius:2px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,rgba(63,240,216,.5),var(--jade));box-shadow:0 0 14px rgba(63,240,216,.5)}
.bar.one .fill{background:linear-gradient(90deg,rgba(240,195,90,.5),var(--gold));box-shadow:0 0 14px rgba(240,195,90,.45)}
.exp{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--paper)}
.bar .v{font-family:var(--f-mono);font-size:12.5px;color:var(--mist);text-align:right;font-variant-numeric:tabular-nums;line-height:1.4}
.legend{display:flex;gap:18px;font-size:13px;color:var(--mist);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:middle;background:var(--jade)}
.legend i.e{width:2px;height:14px;background:var(--paper)}
@media (max-width:760px){.demo{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:44px minmax(0,1fr);}.bar .v{grid-column:2;text-align:left}}

/* About */
.about-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,72px);align-items:start;padding-bottom:clamp(40px,6vw,72px)}

  {t:"[欺瞞|기만]에 의한 [防禦|방어]",s:"[西城|서성]에 [兵力|병력]이 없자 [孔明|공명]은 [城門|성문]을 활짝 열고 [城樓|성루]에서 거문고를 탔다. [司馬懿|사마의]는 [伏兵|복병]을 [疑心|의심]해 [軍|군]을 물렸다.",l:"[攻擊者|공격자]는 보이는 것에 따라 움직인다. [移動標的|이동표적] [防禦|방어]와 [欺瞞|기만] [技術|기술]은 그 [視野|시야]를 바꾸어 모든 [推測|추측]의 [代價|대가]를 높인다.",k:"[移動標的|이동표적] [防禦|방어] · [欺瞞|기만] [技術|기술] · [攻擊者|공격자] [心理|심리]"},
  {t:"[量子|양자] 시뮬레이션",s:"[赤壁大戰|적벽대전] [前|전], [孔明|공명]은 [東南風|동남풍]을 「빌려」 왔다. [實|실]은 그 [季節|계절]의 [氣象|기상]을 읽었던 것이다.",l:"뛰어난 [豫測|예측]은 [魔法|마법]처럼 보인다. [量子|양자] 시뮬레이션은 [古典|고전] 컴퓨터가 따라가지 못하는 [分子|분자]와 [物質|물질]을 [模擬|모의]한다.",k:"[量子|양자] 시뮬레이션 · [確率|확률] · [豫測|예측]"},

function triSVG(bits,size,color){
  size=size||34; color=color||"#f0c35a";
  var w=size,h=size*0.8,g=h/3,sw=h*0.16,out='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">';
  for(var r=0;r<3;r++){ /* top line = bits[2] */
    var bit=bits.charAt(2-r), y=g*r+g/2;
    if(bit==="1") out+='<rect x="0" y="'+(y-sw/2)+'" width="'+w+'" height="'+sw+'" fill="'+color+'"/>';
    else out+='<rect x="0" y="'+(y-sw/2)+'" width="'+(w*0.42)+'" height="'+sw+'" fill="'+color+'"/><rect x="'+(w*0.58)+'" y="'+(y-sw/2)+'" width="'+(w*0.42)+'" height="'+sw+'" fill="'+color+'"/>';
  }
  return out+"</svg>";
}

/* ---------- sky: ink-wash mountains + particle constellations ---------- */
var sky=$("sky"),sctx=sky.getContext("2d"),SW=0,SH=0,DPR=1,bgLayer=null,parts=[];
function rand(a,b){return a+Math.random()*(b-a);}
function buildSky(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  SW=window.innerWidth; SH=window.innerHeight;
  sky.width=SW*DPR; sky.height=SH*DPR;
  bgLayer=document.createElement("canvas"); bgLayer.width=sky.width; bgLayer.height=sky.height;
  var c=bgLayer.getContext("2d"); c.scale(DPR,DPR);
  var g=c.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,"#060912"); g.addColorStop(.6,"#0a1120"); g.addColorStop(1,"#070b16");
  c.fillStyle=g; c.fillRect(0,0,SW,SH);
  /* moon */
  var mx=SW*.82,my=SH*.2,mr=Math.max(50,Math.min(SW,SH)*.09);
  var mg=c.createRadialGradient(mx,my,0,mx,my,mr*3.2);
  mg.addColorStop(0,"rgba(236,230,214,.20)"); mg.addColorStop(.3,"rgba(236,230,214,.06)"); mg.addColorStop(1,"rgba(236,230,214,0)");
  c.fillStyle=mg; c.fillRect(0,0,SW,SH);
  c.beginPath(); c.arc(mx,my,mr,0,Math.PI*2); c.fillStyle="rgba(236,230,214,.08)"; c.fill();
  c.strokeStyle="rgba(63,240,216,.18)"; c.lineWidth=1; c.beginPath(); c.arc(mx,my,mr*1.35,0,Math.PI*2); c.stroke();
  /* mountains */
  var layers=[{y:.66,a:.16,amp:.16,col:"120,140,190"},{y:.76,a:.22,amp:.12,col:"90,110,160"},{y:.87,a:.34,amp:.09,col:"40,52,86"}];
  layers.forEach(function(L,li){
    var ph=[rand(0,9),rand(0,9),rand(0,9)];
    c.save();
    if("filter" in c) c.filter="blur("+(6-li*2)+"px)";
    c.beginPath(); c.moveTo(0,SH);
    for(var x=0;x<=SW+8;x+=8){
      var t=x/SW;
      var y=SH*L.y - SH*L.amp*(0.55*Math.sin(t*3.1+ph[0]) + 0.3*Math.sin(t*7.3+ph[1]) + 0.15*Math.sin(t*17+ph[2]) + 0.45);
      c.lineTo(x,y);
    }
    c.lineTo(SW,SH); c.closePath();
    var mgr=c.createLinearGradient(0,SH*(L.y-L.amp),0,SH);
    mgr.addColorStop(0,"rgba("+L.col+","+L.a+")"); mgr.addColorStop(.55,"rgba("+L.col+","+(L.a*.45)+")"); mgr.addColorStop(1,"rgba(6,9,18,.0)");
    c.fillStyle=mgr; c.fill(); c.restore();
    /* mist band */
    var mist=c.createLinearGradient(0,SH*(L.y-.02),0,SH*(L.y+.08));
    mist.addColorStop(0,"rgba(236,230,214,0)"); mist.addColorStop(.5,"rgba(236,230,214,.035)"); mist.addColorStop(1,"rgba(236,230,214,0)");
    c.fillStyle=mist; c.fillRect(0,SH*(L.y-.02),SW,SH*.1);
  });
  var n=Math.round(Math.min(130,SW*SH/9000));
  parts=[];
  for(var i=0;i<n;i++) parts.push({x:rand(0,SW),y:rand(0,SH),vx:rand(-.08,.08),vy:rand(-.18,-.03),r:rand(.6,1.8),gold:Math.random()<.22,ph:rand(0,6.3)});
}
function drawSky(t){
  sctx.setTransform(1,0,0,1,0,0);
  sctx.drawImage(bgLayer,0,0);
  sctx.setTransform(DPR,0,0,DPR,0,0);
  var i,j,p,q,dx,dy,d2,max=95*95;
  sctx.lineWidth=.6;
  for(i=0;i<parts.length;i++){
    p=parts[i];
    for(j=i+1;j<parts.length;j++){
      q=parts[j]; dx=p.x-q.x; dy=p.y-q.y; d2=dx*dx+dy*dy;
      if(d2<max){ sctx.strokeStyle="rgba(63,240,216,"+(0.11*(1-d2/max))+")"; sctx.beginPath(); sctx.moveTo(p.x,p.y); sctx.lineTo(q.x,q.y); sctx.stroke(); }
    }
  }
  for(i=0;i<parts.length;i++){
    p=parts[i];
    var a=.45+.4*Math.sin(t*.0015+p.ph);
    sctx.fillStyle=p.gold?"rgba(240,195,90,"+a+")":"rgba(63,240,216,"+a+")";
    sctx.beginPath(); sctx.arc(p.x,p.y,p.r,0,Math.PI*2); sctx.fill();
    if(!reduce){ p.x+=p.vx; p.y+=p.vy; if(p.y<-10){p.y=SH+10;p.x=rand(0,SW);} if(p.x<-10)p.x=SW+10; if(p.x>SW+10)p.x=-10; }
  }
}

/* ---------- bagua oracle ---------- */
var bc=$("bagua"),bctx=bc.getContext("2d"),BW=0,BD=1;
var mode="super",chosen=-1,spinUntil=0,spinIdx=0,lastSpin=0;
function sizeBagua(){
  var r=bc.getBoundingClientRect(); if(!r.width) return;
  BD=Math.min(window.devicePixelRatio||1,2); BW=r.width;
  bc.width=BW*BD; bc.height=BW*BD;
}
function drawBagua(t){
  if(!BW||$("v-home").hidden) return;
  var c=bctx,W=BW,cx=W/2,cy=W/2,R=W*.30;
  c.setTransform(BD,0,0,BD,0,0); c.clearRect(0,0,W,W);
  var time=reduce?0:t/1000;
  /* outer rings and 64 hexagram ticks */
  c.strokeStyle="rgba(150,172,226,.22)"; c.lineWidth=1;
  c.beginPath(); c.arc(cx,cy,R*1.3,0,Math.PI*2); c.stroke();
  c.beginPath(); c.arc(cx,cy,R*.7,0,Math.PI*2); c.stroke();
  for(var k=0;k<64;k++){
    var a=k/64*Math.PI*2+time*.05, r1=R*1.3, r2=R*(k%8===0?1.22:1.26);
    c.strokeStyle=k%8===0?"rgba(240,195,90,.55)":"rgba(150,172,226,.28)";
    c.beginPath(); c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); c.stroke();
  }
  var active=-1;
  if(mode==="spin"){ if(t-lastSpin>70){spinIdx=Math.floor(Math.random()*8);lastSpin=t;} active=spinIdx; if(t>=spinUntil){mode="collapsed";updateReadout();} }
  if(mode==="collapsed") active=chosen;
  /* beams */
  for(var i=0;i<8;i++){
    var ang=-Math.PI/2+i*Math.PI/4, px=cx+Math.cos(ang)*R, py=cy+Math.sin(ang)*R;
    var on=(i===active), sup=(mode==="super");
    var amp=sup?(.5+.35*Math.sin(time*2.2+i*.9)):(on?1:.16);
    if(sup||on){
      var lg=c.createLinearGradient(cx,cy,px,py);
      lg.addColorStop(0,on?"rgba(240,195,90,.0)":"rgba(63,240,216,0)");
      lg.addColorStop(1,on?"rgba(240,195,90,.85)":"rgba(63,240,216,"+(amp*.35)+")");
      c.strokeStyle=lg; c.lineWidth=on?2:1; c.beginPath(); c.moveTo(cx,cy); c.lineTo(px,py); c.stroke();
    }
    /* trigram */
    var bits=TRI[RING[i]].b, col=on?"240,195,90":"63,240,216", L=R*.30, sw=R*.05, gap=R*.085;
    c.save(); c.translate(px,py); c.rotate(ang+Math.PI/2);
    c.shadowColor="rgba("+col+","+(on?.9:.6*amp)+")"; c.shadowBlur=on?18:10*amp;
    c.fillStyle="rgba("+col+","+Math.min(1,amp+.1)+")";
    for(var ln=0;ln<3;ln++){
      var bit=bits.charAt(2-ln), y=(ln-1)*gap - sw/2; /* local +y points to centre: bottom line nearest centre */
      if(bit==="1") c.fillRect(-L/2,y,L,sw);
      else { c.fillRect(-L/2,y,L*.42,sw); c.fillRect(L*.08,y,L*.42,sw); }
    }
    c.restore();
    /* labels */
    var lr=R*1.5, lx=cx+Math.cos(ang)*lr, ly=cy+Math.sin(ang)*lr;
    c.textAlign="center"; c.textBaseline="middle";
    c.fillStyle=on?"#f0c35a":"rgba(236,230,214,"+(sup?.85:.35)+")";
    c.font="900 "+Math.round(W*.037)+"px 'Noto Serif TC', serif";
    c.fillText(RING[i],lx,ly-W*.016);
    var rdg=FIX[lang]?FIX[lang][RING[i]]:(lang==="zh"?SIMP[RING[i]]:null);
    if(rdg){ c.save(); c.textAlign="left"; c.font="600 "+Math.round(W*.02)+"px 'Noto Serif JP','Noto Serif KR','Noto Serif SC',serif"; c.fillStyle=on?"#f0c35a":"rgba(240,195,90,"+(sup?.8:.35)+")"; c.fillText(rdg,lx+W*.024,ly-W*.022); c.restore(); }
    c.font="500 "+Math.round(W*.022)+"px 'JetBrains Mono', monospace";
    c.fillStyle=on?"#f0c35a":"rgba(154,163,191,"+(sup?.9:.4)+")";
    c.fillText("|"+bits+"⟩",lx,ly+W*.022);
  }
  /* nucleus + electron orbits */
  for(var o=0;o<3;o++){
    c.save(); c.translate(cx,cy); c.rotate(o*Math.PI/3+time*.15);
    c.strokeStyle="rgba(63,240,216,.28)"; c.lineWidth=1;
    c.beginPath(); c.ellipse(0,0,R*.55,R*.19,0,0,Math.PI*2); c.stroke();
    var ea=time*(1.4+o*.35)+o*2;
    c.fillStyle="#3ff0d8"; c.shadowColor="rgba(63,240,216,.9)"; c.shadowBlur=10;
    c.beginPath(); c.arc(Math.cos(ea)*R*.55,Math.sin(ea)*R*.19,W*.008,0,Math.PI*2); c.fill();
    c.restore();
  }
  var ng=c.createRadialGradient(cx,cy,0,cx,cy,R*.2);
  ng.addColorStop(0,"rgba(255,236,190,1)"); ng.addColorStop(.35,"rgba(240,195,90,.85)"); ng.addColorStop(1,"rgba(240,195,90,0)");
  c.fillStyle=ng; c.beginPath(); c.arc(cx,cy,R*.2,0,Math.PI*2); c.fill();
}

function p1(){var th=theta.value*Math.PI/180;return Math.pow(Math.sin(th/2),2);}
function setBars(c0,c1){
  var tot=1000,e1=p1();
  $("f0").style.width=(c0/tot*100)+"%"; $("f1").style.width=(c1/tot*100)+"%";
  $("e0").style.left="calc("+((1-e1)*100)+"% - 1px)"; $("e1").style.left="calc("+(e1*100)+"% - 1px)";
  $("v0").textContent=Math.round(c0)+" / "+((1-e1)*100).toFixed(1)+"%";
  $("v1").textContent=Math.round(c1)+" / "+(e1*100).toFixed(1)+"%";
}
function runShots(animate){
  var p=p1(),one=0; for(var i=0;i<1000;i++) if(Math.random()<p) one++;
  counts=[1000-one,one];
  if(!animate||reduce){shown=counts.slice();setBars(counts[0],counts[1]);return;}
  var from=shown.slice(); animStart=performance.now();
  (function step(now){
    var k=Math.min(1,(now-animStart)/650), e=1-Math.pow(1-k,3);
    shown=[from[0]+(counts[0]-from[0])*e,from[1]+(counts[1]-from[1])*e];
    setBars(shown[0],shown[1]); if(k<1) requestAnimationFrame(step);
  })(animStart);
}
theta.addEventListener("input",function(){$("thetaOut").textContent=theta.value+"°";drawBloch(+theta.value);setBars(shown[0],shown[1]);});
$("shots").addEventListener("click",function(){runShots(true);});
